plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinavforge.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sinavforge.app"
        minSdk 24          // Android 7.0+ — modern WebView desteği
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release için imzalama: keystore ayarlandıktan sonra aktifleştir
            // signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // assets/www klasörünü dahil et
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    // WebView için ek kütüphane gerekmez — Android'de built-in
}
